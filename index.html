<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base Datos Planeador U Claro</title>
  <style>
    /* Estilos Generales y Vista Entrenador */
    :root {
      --rojo-claro: #da291c;
      --fondo-claro: #f4f4f4;
      --texto-oscuro: #333;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: var(--fondo-claro);
      color: var(--texto-oscuro);
      margin: 0;
      padding: 0;
      transition: background-color 0.3s, color 0.3s;
    }
    header {
      background-color: var(--rojo-claro);
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
    }
    button {
      padding: 8px 15px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      background-color: #333;
      color: white;
    }
    button:hover {
      background-color: #555;
    }
    .contenedor {
      max-width: 1000px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: var(--rojo-claro);
      color: white;
    }

    /* Vista Administrador (Modo Oscuro) */
    body.modo-oscuro {
      background-color: #121212;
      color: #e0e0e0;
    }
    body.modo-oscuro .contenedor {
      background: #1e1e1e;
      box-shadow: 0 4px 6px rgba(255,255,255,0.05);
    }
    .filtros-admin {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }
    .filtros-admin select, .filtros-admin button {
      padding: 8px;
      border-radius: 5px;
    }
    .filtros-admin button {
      background-color: var(--rojo-claro);
    }
    .grid-semanas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }
    .tarjeta-semana {
      background: #2c2c2c;
      padding: 15px;
      border-radius: 8px;
      border-left: 5px solid var(--rojo-claro);
    }
    .tarjeta-semana h3 {
      margin-top: 0;
      border-bottom: 1px solid #444;
      padding-bottom: 5px;
    }
    .tarjeta-semana ul {
      padding-left: 20px;
      font-size: 14px;
    }
    .badge {
      font-size: 12px;
      background: #444;
      padding: 3px 6px;
      border-radius: 4px;
      float: right;
    }
  </style>
</head>
<body>

  <header>
    <h1>Planeador U Claro</h1>
    <button id="btn-modo" onclick="alternarVista()">Entrar como Administrador</button>
  </header>

  <!-- VISTA ENTRENADOR -->
  <main id="vista-entrenador" class="contenedor">
    <h2>Tus Actividades del Mes Actual</h2>
    <p>Solo se muestran las actividades registradas en el mes en curso.</p>
    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Tema</th>
          <th>Duración (hrs)</th>
        </tr>
      </thead>
      <tbody id="tabla-entrenador-body">
        <tr><td colspan="3">Cargando datos...</td></tr>
      </tbody>
    </table>
  </main>

  <!-- VISTA ADMINISTRADOR -->
  <main id="vista-admin" class="contenedor" style="display: none;">
    <h2>Resumen Mensual Administrativo</h2>
    <div class="filtros-admin">
      <select id="filtro-entrenador">
        <option value="todos">Todos los Entrenadores</option>
        <!-- Se llena automáticamente con JS -->
      </select>

      <select id="filtro-mes">
        <option value="0">Enero</option>
        <option value="1">Febrero</option>
        <option value="2">Marzo</option>
        <option value="3">Abril</option>
        <option value="4">Mayo</option>
        <option value="5">Junio</option>
        <option value="6">Julio</option>
        <option value="7">Agosto</option>
        <option value="8">Septiembre</option>
        <option value="9">Octubre</option>
        <option value="10">Noviembre</option>
        <option value="11">Diciembre</option>
      </select>
      
      <button onclick="generarResumenSemanal()">Generar Resumen</button>
    </div>

    <div id="contenedor-semanas" class="grid-semanas">
      <!-- Las tarjetas semanales se generan aquí -->
    </div>
  </main>

  <script>
    // URL DE TU WEB APP DE GOOGLE APPS SCRIPT (Reemplázala con la tuya)
    const urlAppsScript = "TU_URL_DE_GOOGLE_APPS_SCRIPT_AQUI"; 
    
    let datosCompletos = [];
    const anioActual = new Date().getFullYear();

    // 1. Cargar datos al iniciar la página
    async function obtenerDatos() {
      try {
        const respuesta = await fetch(urlAppsScript);
        datosCompletos = await respuesta.json();
        
        cargarVistaEntrenador();
        llenarSelectEntrenadores();
        seleccionarMesActualAdmin();
      } catch (error) {
        document.getElementById("tabla-entrenador-body").innerHTML = 
          `<tr><td colspan="3">Error cargando datos. Verifica el enlace de Apps Script.</td></tr>`;
        console.error("Error:", error);
      }
    }

    // 2. Lógica Vista Entrenador (Mes Actual)
    function cargarVistaEntrenador() {
      const mesActual = new Date().getMonth();
      const tbody = document.getElementById("tabla-entrenador-body");
      tbody.innerHTML = ""; 

      const datosDelMes = datosCompletos.filter(actividad => {
        // Se añade T00:00:00 para evitar que la zona horaria reste un día
        const fecha = new Date(actividad.fecha + "T00:00:00");
        return fecha.getMonth() === mesActual && fecha.getFullYear() === anioActual;
      });

      if (datosDelMes.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3">No hay actividades registradas este mes.</td></tr>`;
        return;
      }

      datosDelMes.forEach(act => {
        tbody.innerHTML += `
          <tr>
            <td>${act.fecha}</td>
            <td>${act.tema || 'Sin tema'}</td>
            <td>${act.duracion || 0}</td>
          </tr>
        `;
      });
    }

    // 3. Lógica Vista Administrador
    function llenarSelectEntrenadores() {
      const select = document.getElementById("filtro-entrenador");
      // Extraemos nombres únicos
      const entrenadoresUnicos = [...new Set(datosCompletos.map(act => act.entrenador).filter(Boolean))];
      
      entrenadoresUnicos.forEach(nombre => {
        select.innerHTML += `<option value="${nombre}">${nombre}</option>`;
      });
    }

    function seleccionarMesActualAdmin() {
      document.getElementById("filtro-mes").value = new Date().getMonth();
    }

    function generarResumenSemanal() {
      const entrenadorElegido = document.getElementById("filtro-entrenador").value;
      const mesElegido = parseInt(document.getElementById("filtro-mes").value);
      
      const datosFiltrados = datosCompletos.filter(actividad => {
        const fechaAct = new Date(actividad.fecha + "T00:00:00");
        const coincideMes = fechaAct.getMonth() === mesElegido && fechaAct.getFullYear() === anioActual;
        const coincideEntrenador = (entrenadorElegido === "todos" || actividad.entrenador === entrenadorElegido);
        return coincideMes && coincideEntrenador;
      });

      // Agrupación por semanas
      const semanas = { 1: [], 2: [], 3: [], 4: [] };

      datosFiltrados.forEach(actividad => {
        const diaDelMes = new Date(actividad.fecha + "T00:00:00").getDate();
        let numeroSemana = Math.ceil(diaDelMes / 7); 
        if (numeroSemana > 4) numeroSemana = 4; // Agrupar días 29, 30, 31 en la semana 4
        semanas[numeroSemana].push(actividad);
      });

      dibujarResumenEnHTML(semanas);
    }

    function dibujarResumenEnHTML(semanas) {
      const contenedor = document.getElementById("contenedor-semanas");
      contenedor.innerHTML = ""; 

      for (let i = 1; i <= 4; i++) {
        const acts = semanas[i];
        let html = `
          <div class="tarjeta-semana">
            <h3>Semana ${i} <span class="badge">${acts.length} act</span></h3>`;
        
        if (acts.length === 0) {
          html += `<p style="color: #888;">Sin registros</p>`;
        } else {
          html += `<ul>`;
          acts.forEach(act => {
            html += `<li><strong>${act.fecha}</strong><br>${act.tema} (${act.duracion}h)</li>`;
          });
          html += `</ul>`;
        }
        
        html += `</div>`;
        contenedor.innerHTML += html;
      }
    }

    // 4. Alternar entre modos
    function alternarVista() {
      const body = document.body;
      const vistaEntrenador = document.getElementById("vista-entrenador");
      const vistaAdmin = document.getElementById("vista-admin");
      const boton = document.getElementById("btn-modo");

      body.classList.toggle("modo-oscuro");

      if (body.classList.contains("modo-oscuro")) {
        vistaEntrenador.style.display = "none";
        vistaAdmin.style.display = "block";
        boton.innerText = "Volver a Vista Entrenador";
        generarResumenSemanal(); // Genera automáticamente al entrar
      } else {
        vistaEntrenador.style.display = "block";
        vistaAdmin.style.display = "none";
        boton.innerText = "Entrar como Administrador";
      }
    }

    // Iniciar el proceso
    obtenerDatos();
  </script>
</body>
</html>
